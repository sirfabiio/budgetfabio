name: Orcamento
options:
  bundleIdPrefix: pt.fabio
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-PT
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Orcamento:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Budget do Fábio
        CFBundleDevelopmentRegion: pt-PT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Usa o Face ID para desbloquear as tuas finanças.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.fabio.orcamento
        PRODUCT_NAME: Orcamento
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OrcamentoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Orcamento
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: pt.fabio.orcamento.tests
schemes:
  Orcamento:
    build:
      targets:
        Orcamento: all
        OrcamentoTests: [test]
    test:
      config: Debug
      targets:
        - OrcamentoTests
    run:
      config: Debug
    archive:
      config: Release
